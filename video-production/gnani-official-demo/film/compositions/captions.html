<div id="cap-0" class="clip cap" data-start="1.35" data-duration="2.472"><span>What if building a 3D world were as easy as</span></div>
<div id="cap-1" class="clip cap" data-start="3.856" data-duration="2.354"><span>describing it? Meet BoliVerse.</span></div>
<div id="cap-2" class="clip cap" data-start="7.35" data-duration="3.385"><span>BoliVerse is a voice controlled 3D studio.</span></div>
<div id="cap-3" class="clip cap" data-start="10.769" data-duration="2.632"><span>Instead of modelling every object by hand,</span></div>
<div id="cap-4" class="clip cap" data-start="13.434" data-duration="1.94"><span>you describe a world in Hindi,</span></div>
<div id="cap-5" class="clip cap" data-start="15.408" data-duration="2.366"><span>Marathi, English or Hinglish,</span></div>
<div id="cap-6" class="clip cap" data-start="17.808" data-duration="2.162"><span>and keep editing it as you speak.</span></div>
<div id="cap-7" class="clip cap st" data-start="21.05" data-duration="1.167"><span>Speak on the left.</span></div>
<div id="cap-8" class="clip cap st" data-start="22.25" data-duration="2.287"><span>Your world appears in the centre.</span></div>
<div id="cap-9" class="clip cap st" data-start="24.57" data-duration="2.607"><span>The Inspector on the right shows every object</span></div>
<div id="cap-10" class="clip cap st" data-start="27.21" data-duration="1.247"><span>and the environment.</span></div>
<div id="cap-11" class="clip cap st" data-start="28.49" data-duration="1.167"><span>Let's build something new,</span></div>
<div id="cap-12" class="clip cap st" data-start="29.69" data-duration="1.58"><span>from an empty scene.</span></div>
<div id="cap-13" class="clip cap st" data-start="36.317" data-duration="2.586"><span>Gnani Prisma turns the speech into text.</span></div>
<div id="cap-14" class="clip cap st" data-start="38.937" data-duration="3.106"><span>BoliVerse compiles it into structured commands,</span></div>
<div id="cap-15" class="clip cap st" data-start="42.077" data-duration="1.806"><span>a river and twenty trees,</span></div>
<div id="cap-16" class="clip cap st" data-start="43.917" data-duration="1.326"><span>and builds a real,</span></div>
<div id="cap-17" class="clip cap st" data-start="45.277" data-duration="1.42"><span>editable scene.</span></div>
<div id="cap-18" class="clip cap st" data-start="53.917" data-duration="2.686"><span>Places are understood relative to what already</span></div>
<div id="cap-19" class="clip cap st" data-start="56.637" data-duration="2.686"><span>exists. The temple sits beside the river,</span></div>
<div id="cap-20" class="clip cap st" data-start="59.357" data-duration="2.14"><span>and the lamps gather around it.</span></div>
<div id="cap-21" class="clip cap st" data-start="67.683" data-duration="1.487"><span>That was Marathi.</span></div>
<div id="cap-22" class="clip cap st" data-start="69.203" data-duration="1.807"><span>A stone bridge spans the river,</span></div>
<div id="cap-23" class="clip cap st" data-start="71.043" data-duration="2.38"><span>and the sky turns to sunrise.</span></div>
<div id="cap-24" class="clip cap st" data-start="79.383" data-duration="2.767"><span>Anything outside the core vocabulary is searched</span></div>
<div id="cap-25" class="clip cap st" data-start="82.183" data-duration="2.86"><span>in a free library of scanned 3D models.</span></div>
<div id="cap-26" class="clip cap st" data-start="89.65" data-duration="1.807"><span>Edits change the same object,</span></div>
<div id="cap-27" class="clip cap st" data-start="91.49" data-duration="2.86"><span>and every step can be undone or redone.</span></div>
<div id="cap-28" class="clip cap st" data-start="98.317" data-duration="2.926"><span>Weather and time of day change the light,</span></div>
<div id="cap-29" class="clip cap st" data-start="101.277" data-duration="2.62"><span>the sky, and even the wet ground.</span></div>
<div id="cap-30" class="clip cap st" data-start="109.65" data-duration="0.998"><span>In Simulate mode,</span></div>
<div id="cap-31" class="clip cap st" data-start="110.681" data-duration="1.955"><span>Rapier physics breaks the bridge into real</span></div>
<div id="cap-32" class="clip cap st" data-start="112.67" data-duration="2.954"><span>debris, and the route system marks the crossing</span></div>
<div id="cap-33" class="clip cap st" data-start="115.657" data-duration="1.013"><span>as blocked.</span></div>
<div id="cap-34" class="clip cap st" data-start="123.35" data-duration="2.077"><span>One sentence rebuilds it in steel,</span></div>
<div id="cap-35" class="clip cap st" data-start="125.46" data-duration="0.993"><span>in the same place,</span></div>
<div id="cap-36" class="clip cap st" data-start="126.486" data-duration="1.804"><span>and the route opens again.</span></div>
<div id="cap-37" class="clip cap st" data-start="136.05" data-duration="2.183"><span>Film mode moves a camera through the same</span></div>
<div id="cap-38" class="clip cap st" data-start="138.266" data-duration="2.283"><span>live world, and exports an MP4,</span></div>
<div id="cap-39" class="clip cap st" data-start="140.583" data-duration="1.767"><span>right in the browser.</span></div>
<div id="cap-40" class="clip cap" data-start="143.383" data-duration="0.768"><span>Under the hood:</span></div>
<div id="cap-41" class="clip cap" data-start="144.184" data-duration="1.966"><span>Gnani Prisma for speech,</span></div>
<div id="cap-42" class="clip cap" data-start="146.183" data-duration="2.065"><span>a multilingual command compiler with Groq</span></div>
<div id="cap-43" class="clip cap" data-start="148.282" data-duration="2.493"><span>as a fallback, validated commands,</span></div>
<div id="cap-44" class="clip cap" data-start="150.808" data-duration="2.576"><span>Three.js, Rapier physics,</span></div>
<div id="cap-45" class="clip cap" data-start="153.418" data-duration="2.345"><span>and Gnani Timbre for spoken replies.</span></div>
